name: Update Game Ownership Data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: cd scripts && npm install axios && cd ..

      - run: node scripts/fetch-steam-ownership.js
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add game-ownership.json
          git commit -m "Update game ownership data" || true
          git push
